# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# FREE plan (trial): no persistent disk, so /data (database, uploads, outputs) is wiped on every
# restart/redeploy, and the site sleeps after ~15 min idle. For real use switch to
# `plan: starter` and add:   disk: {name: data, mountPath: /data, sizeGB: 5}
services:
  - type: web
    name: disha-typist
    runtime: docker
    branch: claude/project-thread-mf02c3
    plan: free
    region: singapore
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SETUP_KEY
        generateValue: true
      - key: KEEP_DAYS
        value: "7"
      # Render asks for this when you apply the Blueprint. Kept in Render, not in the repo,
      # so it survives restarts (a key saved in Admin > Settings is lost on the free plan).
      - key: ANTHROPIC_API_KEY
        sync: false
