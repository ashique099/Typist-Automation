<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>Setup – Disha Online Solution</title>
<style>
  @font-face { font-family:"RupeeSign"; src:local("Segoe UI"), local("Nirmala UI"), local("Arial"), local("Noto Sans"), local("DejaVu Sans"); unicode-range:U+20B9; }
  :root { --red:#C0202A; --blue:#1A2E6C; --navy:#191A3E; --maroon:#9E2330; --bg:#F6F7FB; --text:#1b1f24; --muted:#5b6470; --line:#dde1e6; }
  * { box-sizing:border-box }
  body { margin:0; font-family:"RupeeSign","Poppins",system-ui,"Segoe UI","Nirmala UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh;
         display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) }
  .side { background:linear-gradient(150deg, var(--navy) 0%, var(--blue) 100%); color:#fff; padding:48px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; position:relative; overflow:hidden }
  .side::after { content:""; position:absolute; right:-120px; bottom:-120px; width:380px; height:380px; border-radius:50%; border:48px solid rgba(158,35,48,.65) }
  .side img { width:150px; height:150px; border-radius:50%; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.25) }
  .side h1 { font-size:34px; margin:26px 0 4px; line-height:1.15 } .side .tag { color:#ffb3b8; font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:13px }
  .side p { color:#d6def3; max-width:420px; line-height:1.6; margin:18px 0 0; font-size:15px }
  .side ul { list-style:none; padding:0; margin:22px 0 0; display:grid; gap:10px; font-size:14px; color:#e6ebf8; position:relative; z-index:1 }
  .side li::before { content:"✓"; color:#fff; background:var(--red); border-radius:50%; width:20px; height:20px; display:inline-grid; place-items:center; font-size:11px; margin-right:10px }
  main { display:grid; place-items:center; padding:24px 16px }
  form { width:100%; max-width:380px }
  .mob { display:none; align-items:center; gap:12px; margin-bottom:22px } .mob img { width:52px; height:52px } .mob b { color:var(--navy); display:block } .mob small { color:var(--red); font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase }
  h2 { margin:0; font-size:24px; color:var(--navy) } .lead { margin:6px 0 24px; color:var(--muted); font-size:14px }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px }
  input { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#fff }
  input:focus { outline:2px solid #c5cfe6; border-color:var(--blue) }
  button { margin-top:24px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--red); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit }
  button:hover { background:var(--maroon) }
  .err { color:var(--red); font-size:13px; margin-top:12px; min-height:1em }
  .foot { color:var(--muted); font-size:12px; margin-top:28px }
  @media (max-width:820px) { body { grid-template-columns:1fr } .side { display:none } .mob { display:flex } }
</style>
</head>
<body>
<section class="side">
  <img src="/static/disha-logo.png" alt="Disha Online Classes logo">
  <h1>Disha Online Solution</h1>
  <div class="tag">Direction to Success</div>
  <p>The typist team's workspace: turn live-class panels into finished study material.</p>
</section>
<main>
<form method="post" action="/setup">
  <div class="mob"><img src="/static/disha-logo.png" alt="Disha"><div><b>Disha Online Solution</b><small>Direction to Success</small></div></div>
  <h2>First-Time Setup</h2><p class="lead">Create the admin (owner) account. The admin then adds a login for each typist.</p>
  <label for="n">Your Name</label>
  <input id="n" name="name" autocomplete="name" required>
  <label for="u">Username (Used to Sign In, e.g. ashique)</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="new-password" minlength="6" required>
  <label for="pw2">Confirm Password</label>
  <input id="pw2" name="password2" type="password" autocomplete="new-password" minlength="6" required>
  {{keyfield}}
  <button type="submit">Create Admin Account</button>
  <div class="err">{{error}}</div>
</form>
</main>
</body>
</html>
